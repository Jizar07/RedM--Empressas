<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <filter id="emboss" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology operator="dilate" radius="1"/>
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- BLACK text -->
  <text x="200" y="80" text-anchor="middle" font-family="serif" font-size="42" font-weight="bold" 
        fill="url(#goldGradient)" filter="url(#emboss)">BLACK</text>
  
  <!-- GOLDEN text -->
  <text x="200" y="140" text-anchor="middle" font-family="serif" font-size="42" font-weight="bold" 
        fill="url(#goldGradient)" filter="url(#emboss)">GOLDEN</text>
  
  <!-- Decorative leaves -->
  <g transform="translate(200,180)">
    <!-- Left branch -->
    <path d="M-40,0 Q-50,-5 -60,-2 Q-55,2 -40,0" fill="url(#goldGradient)"/>
    <path d="M-50,0 Q-60,-8 -70,-5 Q-65,3 -50,0" fill="url(#goldGradient)"/>
    <path d="M-30,0 Q-40,-3 -50,0 Q-45,4 -30,0" fill="url(#goldGradient)"/>
    
    <!-- Right branch -->
    <path d="M40,0 Q50,-5 60,-2 Q55,2 40,0" fill="url(#goldGradient)"/>
    <path d="M50,0 Q60,-8 70,-5 Q65,3 50,0" fill="url(#goldGradient)"/>
    <path d="M30,0 Q40,-3 50,0 Q45,4 30,0" fill="url(#goldGradient)"/>
  </g>
</svg>